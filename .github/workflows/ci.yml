name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  # -------------------------------------------------------
  # Playwright e2e — draait op staging (develop branch)
  # Pas als dit slaagt is merge naar main verantwoord
  # -------------------------------------------------------
  playwright:
    name: Playwright e2e (staging)
    runs-on: ubuntu-latest
    # Alleen op develop en PRs naar develop/main
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    env:
      # Zet PLAYWRIGHT_STAGING_URL in GitHub → Settings → Secrets
      # Waarde: de Vercel preview URL van de develop branch
      # bijv. https://rrr-git-develop-jouwteam.vercel.app
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # -------------------------------------------------------
  # Lighthouse — draait op productie na merge naar main
  # Tests zijn al gevalideerd op staging
  # -------------------------------------------------------
  lighthouse:
    name: Lighthouse CI (productie)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install LHCI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.url="https://www.rouletteroutes.nl/" \
            --collect.url="https://www.rouletteroutes.nl/wandelingen" \
            --collect.url="https://www.rouletteroutes.nl/wandelingen/hoge-veluwe-okt-2026" \
            --collect.url="https://www.rouletteroutes.nl/over" \
            --config=.lighthouserc.js
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
