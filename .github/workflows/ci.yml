name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------
  # Playwright e2e tests against the production site
  # -------------------------------------------------------
  playwright:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # Only run after a successful Vercel deploy (push to main)
    # For PRs we test against the PR preview URL if available,
    # otherwise skip (set PLAYWRIGHT_BASE_URL as a secret for production).
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'https://www.rouletteroutes.nl' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # -------------------------------------------------------
  # Lighthouse against production
  # -------------------------------------------------------
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: playwright
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install LHCI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.url="https://www.rouletteroutes.nl/" \
            --collect.url="https://www.rouletteroutes.nl/wandelingen" \
            --collect.url="https://www.rouletteroutes.nl/wandelingen/hoge-veluwe-okt-2026" \
            --collect.url="https://www.rouletteroutes.nl/over" \
            --collect.url="https://www.rouletteroutes.nl/aanmelden" \
            --config=.lighthouserc.js
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
